{{ if or (and .Values.openunison.enable_provisioning .Values.openunison.amq.enabled) (and .Values.openunison.enable_provisioning .Values.openunison.enable_activemq ) }}
{{ if not (or .Values.openunison.amq.pvc.enabled .Values.openunison.activemq_use_pvc) }}
{{ if eq (substr 0 15 .Values.database.url)  "jdbc:postgresql"}}
{{ if eq .Values.openunison.amq.version 6 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: activemq-config-{{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
data:
  activemq.xml: |-
    <!--
        Licensed to the Apache Software Foundation (ASF) under one or more
        contributor license agreements.  See the NOTICE file distributed with
        this work for additional information regarding copyright ownership.
        The ASF licenses this file to You under the Apache License, Version 2.0
        (the "License"); you may not use this file except in compliance with
        the License.  You may obtain a copy of the License at

        http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.
    -->
    <!-- START SNIPPET: example -->
    <beans
    xmlns="http://www.springframework.org/schema/beans"
    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
    xsi:schemaLocation="http://www.springframework.org/schema/beans http://www.springframework.org/schema/beans/spring-beans.xsd
    http://activemq.apache.org/schema/core http://activemq.apache.org/schema/core/activemq-core.xsd">




        <!-- Allows us to use system properties as variables in this configuration file -->
        <bean class="org.springframework.beans.factory.config.PropertyPlaceholderConfigurer">
            <property name="locations">
                <value>file:${activemq.conf}/credentials.properties</value>
            </property>
        </bean>





        <!--
            The <broker> element is used to configure the ActiveMQ broker.
        -->
        <broker xmlns="http://activemq.apache.org/schema/core" brokerName="localhost" dataDirectory="${activemq.data}">

            <destinationPolicy>
                <policyMap>
                <policyEntries>
                    <policyEntry topic=">" >
                        <!-- The constantPendingMessageLimitStrategy is used to prevent
                            slow topic consumers to block producers and affect other consumers
                            by limiting the number of messages that are retained
                            For more information, see:

                            http://activemq.apache.org/slow-consumer-handling.html

                        -->
                    <pendingMessageLimitStrategy>
                        <constantPendingMessageLimitStrategy limit="1000"/>
                    </pendingMessageLimitStrategy>
                    </policyEntry>
                </policyEntries>
                </policyMap>
            </destinationPolicy>


            <!--
                The managementContext is used to configure how ActiveMQ is exposed in
                JMX. By default, ActiveMQ uses the MBean server that is started by
                the JVM. For more information, see:

                http://activemq.apache.org/jmx.html
            -->
            <managementContext>
                <managementContext createConnector="false"/>
            </managementContext>

            <!--
                Configure message persistence for the broker. The default persistence
                mechanism is the KahaDB store (identified by the kahaDB tag).
                For more information, see:

                http://activemq.apache.org/persistence.html
            -->
            <persistenceAdapter>
        <jdbcPersistenceAdapter
                dataDirectory="${activemq.base}/data"
                dataSource="#mysql-ds">
                <statements>
                    <statements binaryDataType="MEDIUMBLOB"/>
                </statements>
            </jdbcPersistenceAdapter>
        </persistenceAdapter>




            <!--
                The systemUsage controls the maximum amount of space the broker will
                use before disabling caching and/or slowing down producers. For more information, see:
                http://activemq.apache.org/producer-flow-control.html
            -->
            <systemUsage>
                <systemUsage>
                    <memoryUsage>
                        <memoryUsage percentOfJvmHeap="70" />
                    </memoryUsage>
                    <storeUsage>
                        <storeUsage limit="256 mb"/>
                    </storeUsage>
                    <tempUsage>
                        <tempUsage limit="256 mb"/>
                    </tempUsage>
                </systemUsage>
            </systemUsage>

            <!--
                The transport connectors expose ActiveMQ over a given protocol to
                clients and other brokers. For more information, see:

                http://activemq.apache.org/configuring-transports.html
            -->
            <sslContext>
                <sslContext
                        keyStore="/etc/activemq-secrets/amq.p12" keyStorePassword="${TLS_KS_PWD}"
                        trustStore="/etc/activemq-secrets/amq.p12" trustStorePassword="${TLS_KS_PWD}" trustStoreType="pkcs12" keyStoreType="pkcs12"/>
                </sslContext>
            <transportConnectors>
                    <!-- DOS protection, limit concurrent connections to 1000 and frame size to 100MB -->
                    {{ if .Values.openunison.amq.use_token }}
                    <transportConnector name="openwire" uri="ssl://0.0.0.0:61616?maximumConnections=1000&amp;wireFormat.maxFrameSize=104857600"/>
                    {{ else }}
                    <transportConnector name="openwire" uri="ssl://0.0.0.0:61616?maximumConnections=1000&amp;wireFormat.maxFrameSize=104857600&amp;needClientAuth=true"/>
                    {{ end }}
                    
                </transportConnectors>

            <!-- destroy the spring context on shutdown to stop jetty -->
            <shutdownHooks>
                <bean xmlns="http://www.springframework.org/schema/beans" class="org.apache.activemq.hooks.SpringContextHook" />
            </shutdownHooks>
                <networkConnectors>
{{ if .Values.openunison.amq.remote_brokers }}
{{ $remote_queue_num := 0 }}
{{ $remote_queues := splitList "," .Values.openunison.non_secret_data.K8S_DR_QUEUES }}
{{ range $host := .Values.openunison.amq.remote_brokers}}
                    <networkConnector  uri="static:(ssl://{{ $host }})" >
                        <dynamicallyIncludedDestinations>
                            <queue physicalName="{{ index $remote_queues $remote_queue_num }}" />
                            {{ $remote_queue_num := add1 $remote_queue_num }}
                        </dynamicallyIncludedDestinations>
                        <excludedDestinations>
                            <queue physicalName="ActiveMQ.DLQ" />
                        </excludedDestinations>
                    </networkConnector>
{{ end }}
{{ end }}
                </networkConnectors>
        </broker>

        <!-- ActiveMQ Classic 6.3 / Jetty 12.1 / Jakarta EE 11.
                 Console authentication remains certificate-based on HTTPS;
                 HTTP is bound to loopback for local probes, as in the original. -->
            <bean id="adminWebApp" class="org.eclipse.jetty.ee11.webapp.WebAppContext">
                <property name="contextPath" value="/admin" />
                <property name="baseResourceAsString" value="${activemq.home}/webapps/admin" />
                <property name="logUrlOnStart" value="true" />
            </bean>
            <bean id="adminJspScan" class="org.springframework.beans.factory.config.MethodInvokingFactoryBean">
                <property name="targetObject" ref="adminWebApp" />
                <property name="targetMethod" value="setAttribute" />
                <property name="arguments">
                    <list>
                        <value>org.eclipse.jetty.server.webapp.ContainerIncludeJarPattern</value>
                        <value>.*/jetty-ee11-[^/]*\.jar$|.*/jakarta\.servlet-api-[^/]*\.jar$|.*/jakarta\.servlet\.jsp\.jstl.*\.jar$</value>
                    </list>
                </property>
            </bean>
            <bean id="adminInstanceManager" class="org.springframework.beans.factory.config.MethodInvokingFactoryBean">
                <property name="targetObject" ref="adminWebApp" />
                <property name="targetMethod" value="setAttribute" />
                <property name="arguments">
                    <list>
                        <value>org.apache.tomcat.InstanceManager</value>
                        <bean class="org.apache.tomcat.SimpleInstanceManager" />
                    </list>
                </property>
            </bean>
            <bean id="apiWebApp" class="org.eclipse.jetty.ee11.webapp.WebAppContext">
                <property name="contextPath" value="/api" />
                <property name="baseResourceAsString" value="${activemq.home}/webapps/api" />
                <property name="logUrlOnStart" value="true" />
            </bean>
            <bean id="apiJspScan" class="org.springframework.beans.factory.config.MethodInvokingFactoryBean">
                <property name="targetObject" ref="apiWebApp" />
                <property name="targetMethod" value="setAttribute" />
                <property name="arguments">
                    <list>
                        <value>org.eclipse.jetty.server.webapp.ContainerIncludeJarPattern</value>
                        <value>.*/jetty-ee11-[^/]*\.jar$|.*/jakarta\.servlet-api-[^/]*\.jar$|.*/jakarta\.servlet\.jsp\.jstl.*\.jar$</value>
                    </list>
                </property>
            </bean>
            <bean id="apiInstanceManager" class="org.springframework.beans.factory.config.MethodInvokingFactoryBean">
                <property name="targetObject" ref="apiWebApp" />
                <property name="targetMethod" value="setAttribute" />
                <property name="arguments">
                    <list>
                        <value>org.apache.tomcat.InstanceManager</value>
                        <bean class="org.apache.tomcat.SimpleInstanceManager" />
                    </list>
                </property>
            </bean>
            <bean id="consoleContexts" class="org.eclipse.jetty.server.handler.ContextHandlerCollection">
                <constructor-arg><array value-type="org.eclipse.jetty.server.handler.ContextHandler" /></constructor-arg>
                <property name="handlers">
                    <list>
                        <ref bean="adminWebApp" />
                        <ref bean="apiWebApp" />
                    </list>
                </property>
            </bean>
            <bean id="consoleResources" class="org.eclipse.jetty.server.handler.ResourceHandler">
                <property name="dirAllowed" value="false" />
                <property name="welcomeFiles"><list><value>index.html</value></list></property>
                <property name="baseResourceAsString" value="${activemq.home}/webapps/" />
            </bean>
            <bean id="consoleHandlers" class="org.eclipse.jetty.server.Handler$Sequence">
                <constructor-arg><list /></constructor-arg>
                <property name="handlers">
                    <list>
                        <ref bean="consoleContexts" />
                        <ref bean="consoleResources" />
                        <bean class="org.eclipse.jetty.server.handler.DefaultHandler">
                            <property name="serveFavIcon" value="false" />
                        </bean>
                    </list>
                </property>
            </bean>
            <bean id="consoleHeaders" class="org.eclipse.jetty.rewrite.handler.RewriteHandler">
                <property name="rules">
                    <list>
                        <bean class="org.eclipse.jetty.rewrite.handler.HeaderPatternRule">
                            <property name="pattern" value="/*" />
                            <property name="headerName" value="X-FRAME-OPTIONS" />
                            <property name="headerValue" value="SAMEORIGIN" />
                        </bean>
                    </list>
                </property>
                <property name="handler" ref="consoleHandlers" />
            </bean>
            <bean id="Server" class="org.eclipse.jetty.server.Server" destroy-method="stop">
                <property name="handler" ref="consoleHeaders" />
            </bean>
            <bean id="httpConfig" class="org.eclipse.jetty.server.HttpConfiguration">
                <property name="sendServerVersion" value="false" />
            </bean>
            <bean id="httpsConfig" class="org.eclipse.jetty.server.HttpConfiguration">
                <constructor-arg ref="httpConfig" />
                <property name="secureScheme" value="https" />
                <property name="securePort" value="8162" />
                <property name="customizers">
                    <list><bean class="org.eclipse.jetty.server.SecureRequestCustomizer" /></list>
                </property>
            </bean>
            <bean id="consoleSslContext" class="org.eclipse.jetty.util.ssl.SslContextFactory$Server">
                <property name="keyStorePath" value="/etc/activemq-secrets/amq.p12" />
                <property name="keyStorePassword" value="${TLS_KS_PWD}" />
                <property name="keyStoreType" value="PKCS12" />
                <property name="trustStorePath" value="/etc/activemq-secrets/amq.p12" />
                <property name="trustStorePassword" value="${TLS_KS_PWD}" />
                <property name="trustStoreType" value="PKCS12" />
                <property name="needClientAuth" value="true" />
            </bean>
            <bean id="invokeConnectors" class="org.springframework.beans.factory.config.MethodInvokingFactoryBean">
                <property name="targetObject" ref="Server" />
                <property name="targetMethod" value="setConnectors" />
                <property name="arguments">
                    <list>
                        <bean class="org.eclipse.jetty.server.ServerConnector">
                            <constructor-arg ref="Server" />
                            <constructor-arg>
                                <array value-type="org.eclipse.jetty.server.ConnectionFactory">
                                    <bean class="org.eclipse.jetty.server.HttpConnectionFactory">
                                        <constructor-arg ref="httpConfig" />
                                    </bean>
                                </array>
                            </constructor-arg>
                            <property name="host" value="127.0.0.1" />
                            <property name="port" value="8161" />
                        </bean>
                        <bean class="org.eclipse.jetty.server.ServerConnector">
                            <constructor-arg ref="Server" />
                            <constructor-arg>
                                <array value-type="org.eclipse.jetty.server.ConnectionFactory">
                                    <bean class="org.eclipse.jetty.server.SslConnectionFactory">
                                        <constructor-arg ref="consoleSslContext" />
                                        <constructor-arg value="http/1.1" />
                                    </bean>
                                    <bean class="org.eclipse.jetty.server.HttpConnectionFactory">
                                        <constructor-arg ref="httpsConfig" />
                                    </bean>
                                </array>
                            </constructor-arg>
                            <property name="host" value="0.0.0.0" />
                            <property name="port" value="8162" />
                        </bean>
                    </list>
                </property>
            </bean>
            <bean id="invokeStart" class="org.springframework.beans.factory.config.MethodInvokingFactoryBean"
                  depends-on="invokeConnectors,adminJspScan,adminInstanceManager,apiJspScan,apiInstanceManager">
                <property name="targetObject" ref="Server" />
                <property name="targetMethod" value="start" />
            </bean>

            <!-- setup mysql access -->
        <bean id="mysql-ds" class="org.apache.commons.dbcp.BasicDataSource" destroy-method="close">
            <property name="driverClassName" value="#{systemEnvironment['JDBC_DRIVER']}"/>
            <property name="url" value="${JDBC_URL}"/>
            <property name="username" value="#{systemEnvironment['JDBC_USER']}"/>
            <property name="password" value="#{systemEnvironment['JDBC_PASSWORD']}"/>
            <property name="poolPreparedStatements" value="true"/>
        </bean>

    </beans>
    <!-- END SNIPPET: example -->
{{ end }}
{{ end }}
{{ end }}
{{ end }}